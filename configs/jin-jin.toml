# OpenPaw — 金金 (Jin-Jin) Agent Config
# 黃金獵犬 AI 助手，寵物照護問答 + 每日推播

[discord]
bot_token = "${DISCORD_BOT_TOKEN}"
allowed_channels = []  # 填入你的頻道 ID

[gateway]
url = "ws://openab-gateway:8080/ws"
platform = "line"

[agent]
command = "claude"
args = ["code", "--trust-all-tools"]
working_dir = "/home/bklinu/devProject/OpenPaw/agents/jin-jin"
env = { ANTHROPIC_API_KEY = "${ANTHROPIC_API_KEY}" }

[pool]
max_sessions = 5
session_ttl_hours = 24

[reactions]
enabled = true

[markdown]
format = "bullets"

[cron]
usercron_enabled = true
usercron_path = "cronjob.toml"
