# OpenPaw — 金金排程任務
# Cronjob hot-reload: 修改此檔案後 OpenAB 會在 1 分鐘內自動載入，不需重啟

# === 每日早安 (08:00 CST) ===
[[jobs]]
enabled = true
schedule = "0 8 * * *"
channel = ""  # 填入目標頻道 ID
platform = "discord"
sender_name = "金金"
timezone = "Asia/Taipei"
message = """今天是新的一天！請幫大家：
1. 查一下今天台北的天氣
2. 根據天氣給寵物照護提醒（熱天補水、雨天擦腳、冷天保暖）
3. 找一則今天有趣的寵物相關新聞
4. 用你的方式跟大家說早安
記得你是金金，一隻熱情的黃金獵犬～"""

# === 每日晚安 (22:00 CST) ===
[[jobs]]
enabled = true
